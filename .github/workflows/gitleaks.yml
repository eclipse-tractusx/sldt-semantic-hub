name: gitleaks
on: [push, pull_request, workflow_dispatch]
jobs:
  gitleaks-run:
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: '0'

      - name: Run Gitleaks
        id: gitleaks
        run: |
          git config --global --add safe.directory $PWD
          gitleaks detect -f sarif -r ./gitleaks-report-semantic-hub.sarif --exit-code 0

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: ./gitleaks-report-semantic-hub.sarif
        

  gitleaks-upload:
    runs-on: ubuntu-latest
    needs: gitleaks-run
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gitleaks-report
      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: ./gitleaks-report-semantic-hub.sarif
